name: Build and Test (.NET & Blazor)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore FlagExplorerApp.sln

    - name: Build Solution
      run: dotnet build FlagExplorerApp.sln --no-restore --configuration Release

    - name: Run API Unit Tests
      run: dotnet test FlagExplorer.API.Tests/FlagExplorer.API.Tests.csproj --no-build --verbosity normal

    - name: Run API Integration Tests
      run: dotnet test FlagExplorer.API.IntegrationTests/FlagExplorer.API.IntegrationTests.csproj --no-build --verbosity normal

    - name: Run Blazor Frontend Tests
      run: dotnet test FlagExplorer.BlazorApp.Tests/FlagExplorer.BlazorApp.Tests.csproj --no-build --verbosity normal

    - name: Publish API Backend
      run: dotnet publish FlagExplorer.API/FlagExplorer.API.csproj -c Release -o ./publish/backend

    - name: Publish Blazor Frontend
      run: dotnet publish FlagExplorer.Client/FlagExplorer.Client.csproj -c Release -o ./publish/frontend

    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v2
      with:
        name: backend
        path: ./publish/backend/

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v2
      with:
        name: frontend
        path: ./publish/frontend/
